<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    const USERNAME = "tibblingai";
    const PASSWORD = "tibbtech123";

    const user = prompt("Enter username:");
    const pass = prompt("Enter password:");

    if (user !== USERNAME || pass !== PASSWORD) {
      document.write("<style>body{display:none !important;}</style><h2 style='color:red; text-align:center; margin-top:100px;'>Access Denied</h2>");
      throw new Error("Access Denied");
    }
  </script>

  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Partner Tracker</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f0f0f;
      color: #e5e7eb;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #f1f5f9;
    }

    .filter-section {
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      background-color: #1f2937;
      padding: 1rem;
      border-radius: 8px;
    }

    .filter-section label {
      font-size: 0.9rem;
      color: #9ca3af;
    }

    .filter-section select {
      background-color: #111827;
      color: #e5e7eb;
      border: 1px solid #374151;
      border-radius: 5px;
      padding: 4px 8px;
    }

    .status-dropdown, .date-input, .note-input {
      background-color: #1f2937;
      color: #f3f4f6;
      border: 1px solid #374151;
      border-radius: 5px;
      padding: 4px;
      width: 100%;
      box-sizing: border-box;
    }

    th.position-col, td.position-col {
      width: 100px;
      max-width: 100px;
      word-wrap: break-word;
    }

    .subcategory-col {
      width: 130px;
      max-width: 130px;
      white-space: normal;
      word-break: break-word;
    }

    .note-input {
      white-space: normal;
      word-break: break-word;
      height: auto;
    }

    td:nth-child(12) {
      max-width: 250px;
    }

    table.dataTable {
      background-color: #111827;
      color: #e5e7eb;
    }

    table.dataTable thead {
      background-color: #1f2937;
      color: #f3f4f6;
    }

    table.dataTable tbody tr:nth-child(even) {
      background-color: #1c1c1c;
    }

    table.dataTable tbody tr:nth-child(odd) {
      background-color: #111827;
    }

    table.dataTable td, table.dataTable th {
      border-color: #374151;
    }

    table.dataTable tbody tr:hover {
      background-color: #374151;
    }

    table.dataTable.no-footer {
      border-color: #374151;
    }

    div.dataTables_length, div.dataTables_info {
      color: #9ca3af;
    }

    div.dataTables_paginate .paginate_button {
      color: #60a5fa !important;
    }

    a {
      color: #60a5fa;
    }

    a:hover {
      color: #93c5fd;
    }
    .status-in-talks {
      background-color: #85864c !important; /* medium green */
    }

    .status-connected {
      background-color: #539296 !important; /* darker green */
    }

    .status-partnered {
      background-color: #018763 !important; /* teal green */
    }

    .status-not-interested {
      background-color: #4b1e1e !important; /* dark red */
    }

    .status-completed {
      background-color: #346938 !important; /* dark blue-grey */
    }

    .status-contacted {
      background-color: #3e5c8c !important; /* mid gray */
    }

    .status-not-started {
      background-color: transparent !important; /* default / transparent */
    }

  </style>
</head>
  
<body>
  <h1>Potential Partners</h1>

  <div class="filter-section" style="flex-wrap: wrap; gap: 20px; align-items: flex-end;">
    <div style="display: flex; flex-wrap: wrap; gap: 20px; flex: 1;">
      <div>
        <label for="highLevelFilter">High-Level Category:</label>
        <select id="highLevelFilter">
          <option value="">All</option>
          <option value="Drug Discovery">Drug Discovery</option>
          <option value="Rehab">Rehab</option>
          <option value="Therapy">Therapy</option>
        </select>
      </div>
  
      <div>
        <label for="subLevelFilter">Specialization:</label>
        <select id="subLevelFilter">
          <option value="">All</option>
          <option value="ALS">ALS</option>
          <option value="Parkinsons">Parkinsons</option>
          <option value="Huntington">Huntington</option>
          <option value="Alzheimer">Alzheimer</option>
          <option value="Stroke Rehab">Stroke Rehab</option>
          <option value="Cognitive Therapy">Cognitive Therapy</option>
          <option value="2D/3D Imaging">2D/3D Imaging</option>
        </select>
      </div>
  
      <div>
        <label for="regionFilter">Region:</label>
        <select id="regionFilter">
          <option value="">All</option>
          <option value="US">US</option>
          <option value="Europe">Europe</option>
          <option value="UAE">UAE</option>
          <option value="Australia">Australia</option>
        </select>
      </div>
  
      <div>
        <label for="typeFilter">Partnership Type:</label>
        <select id="typeFilter">
          <option value="">All</option>
          <option value="Academic">Academic</option>
          <option value="Industrial">Industrial</option>
        </select>
      </div>
    </div>
  
    <div style="margin-left: auto;">
      <button onclick="showAddPartnerModal()" style="background:#2563eb; color:white; padding:10px 20px; border:none; border-radius:5px;">
        Add New Partner
      </button>
    </div>
  </div>
  
  <div id="addPartnerModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background-color:rgba(0,0,0,0.6); z-index:999; justify-content:center; align-items:center;">
    <div class="filter-section" style="width:600px; max-height:90vh; overflow-y:auto; position:relative; background-color:#1f2937;">
      <button onclick="hideAddPartnerModal()" style="position:absolute; top:10px; right:10px; background:#ef4444; color:white; border:none; padding:5px 10px; border-radius:5px;">X</button>
      <h3 style="color: #f9fafb;">Add New Partner</h3>
  
      <input class="status-dropdown" id="addCompany" placeholder="Company" />
      <input class="status-dropdown" id="addRanking" placeholder="Ranking (number)" type="number" />
      <input class="status-dropdown" id="addContact" placeholder="Contact Person" />
      <input class="status-dropdown" id="addPosition" placeholder="Position" />
      <select class="status-dropdown" id="addType">
        <option value="">Partnership Type</option>
        <option value="Academic">Academic</option>
        <option value="Industrial">Industrial</option>
      </select>
      <select class="status-dropdown" id="addCategory">
        <option value="">Category</option>
        <option value="Drug Discovery">Drug Discovery</option>
        <option value="Rehab">Rehab</option>
        <option value="Therapy">Therapy</option>
      </select>
      <select class="status-dropdown" id="addSubcategory">
        <option value="">Subcategory</option>
        <option value="ALS">ALS</option>
        <option value="Parkinsons">Parkinsons</option>
        <option value="Huntington">Huntington</option>
        <option value="Alzheimer">Alzheimer</option>
        <option value="Stroke Rehab">Stroke Rehab</option>
        <option value="Cognitive Therapy">Cognitive Therapy</option>
        <option value="2D/3D Imaging">2D/3D Imaging</option>
      </select>
      <select class="status-dropdown" id="addRegion">
        <option value="">Region</option>
        <option value="US">US</option>
        <option value="Europe">Europe</option>
        <option value="UAE">UAE</option>
        <option value="Australia">Australia</option>
      </select>
      <input class="date-input" id="addStartDate" placeholder="Start Date" type="date" />
      <input class="date-input" id="addEndDate" placeholder="End Date" type="date" />
      <input class="status-dropdown" id="addEmail" placeholder="Email" />
      <input class="status-dropdown" id="addURL" placeholder="Website URL" />
      <textarea class="note-input" id="addNotes" placeholder="Notes or Expertise"></textarea>
  
      <button onclick="addNewPartner()" style="background:#2563eb; color:white; padding:10px 20px; border:none; border-radius:5px; margin-top:10px;">Add Partner</button>
    </div>
  </div>
  

  <table id="partnersTable" class="display" style="width:100%">
    <thead>
      <tr>
        <th>Company</th>
        <th>Ranking</th> <!-- 🆕 New Column -->
        <th>Contact Person</th>
        <th class="position-col">Position</th>
        <th>Partnership Type</th>
        <th>Category</th>
        <th class="subcategory-col">Subcategory</th>
        <th>Region</th>
        <th>Status</th>
        <th>Start Date</th>
        <th>End Date</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script>
    let partnerData = [];

    const statusOptions = ["Not Started", "Contacted", "In Talks", "Connected", "Partnered", "Not Interested", "Completed"];

    function saveToLocalStorage() {
      localStorage.setItem("partnerData", JSON.stringify(partnerData));
    }

    function fetchCSVData() {
      Papa.parse("partners.csv", {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function (results) {
          partnerData = results.data.map(entry => ({
            ...entry,
            status: "Not Started",
            startDate: "",
            endDate: "",
            notes: `${entry.notes || ''} ${entry.Expertise || ''}`.trim(),
            Ranking: parseInt(entry.Ranking || "9999")
          }));
          saveToLocalStorage();
          populateTable();
        }
      });
    }

    function populateTable() {
      const tableBody = $('#partnersTable tbody');
      tableBody.empty();

      partnerData.forEach((partner, index) => {
        const statusClass = "status-" + (partner.status || "not-started").toLowerCase().replace(/\s+/g, "-");
        const statusDropdown = `
          <select class="status-dropdown" onchange="updateStatus(${index}, this.value)">
            ${statusOptions.map(opt => `<option value="${opt}" ${opt === partner.status ? 'selected' : ''}>${opt}</option>`).join('')}
          </select>
        `;

        const startDateInput = `<input type="date" class="date-input" value="${partner.startDate}" onchange="updateStartDate(${index}, this.value)" />`;
        const endDateInput = `<input type="date" class="date-input" value="${partner.endDate}" onchange="updateEndDate(${index}, this.value)" />`;
        const notesInput = `<textarea class="note-input" onchange="updateNotes(${index}, this.value)">${partner.notes}</textarea>`;
        const rowClass = partner.status === "In Talks" ? "in-talks-row" : "";
        const row = `
        <tr class="${statusClass}" data-high="${partner.Category}" data-sub="${partner.Subcategory}" data-region="${partner.Region}" data-type="${partner["Partnership Type"]}">
            <td><a href="${partner.URL}" target="_blank">${partner.Company}</a></td>
            <td>${partner.Ranking}</td>
            <td><a href="mailto:${partner.Email}">${partner["Contact person"]}</a></td>
            <td class="position-col">${partner.Position}</td>
            <td>${partner["Partnership Type"]}</td>
            <td>${partner.Category}</td>
            <td class="subcategory-col">${partner.Subcategory}</td>
            <td>${partner.Region}</td>
            <td>${statusDropdown}</td>
            <td>${startDateInput}</td>
            <td>${endDateInput}</td>
            <td>${notesInput}</td>
          </tr>
        `;
        tableBody.append(row);
      });

      $('#partnersTable').DataTable({
        dom: '<"top-filter-section">rt<"bottom"lip><"clear">',
        order: [[1, 'asc']] // ⬅️ Default sort by Ranking column
      });
    }

    function updateStatus(index, newStatus) {
      partnerData[index].status = newStatus;
      saveToLocalStorage();

      const row = $('#partnersTable tbody tr').eq(index);
      
      // Remove any previous status- class
      row.removeClass(function (i, className) {
        return (className.match(/(^|\s)status-\S+/g) || []).join(' ');
      });

      const newClass = "status-" + newStatus.toLowerCase().replace(/\s+/g, "-");
      row.addClass(newClass);
    }



    function updateStartDate(index, newDate) {
      partnerData[index].startDate = newDate;
      saveToLocalStorage();
    }

    function updateEndDate(index, newDate) {
      partnerData[index].endDate = newDate;
      saveToLocalStorage();
    }

    function updateNotes(index, newNote) {
      partnerData[index].notes = newNote;
      saveToLocalStorage();
    }

    $(document).ready(function () {
      if (localStorage.getItem("partnerData")) {
        partnerData = JSON.parse(localStorage.getItem("partnerData"));
        populateTable();
      } else {
        fetchCSVData();
      }

      $('#highLevelFilter, #subLevelFilter, #regionFilter, #typeFilter').on('change', function () {
        filterTable();
      });
    });

    function filterTable() {
      const high = $('#highLevelFilter').val();
      const sub = $('#subLevelFilter').val();
      const region = $('#regionFilter').val();
      const type = $('#typeFilter').val();

      const table = $('#partnersTable').DataTable();
      table.rows().every(function () {
        const row = $(this.node());
        const highMatch = !high || row.data('high') === high;
        const subMatch = !sub || row.data('sub') === sub;
        const regionMatch = !region || row.data('region') === region;
        const typeMatch = !type || row.data('type') === type;

        if (highMatch && subMatch && regionMatch && typeMatch) {
          row.show();
        } else {
          row.hide();
        }
      });
    }

    function addNewPartner() {
      const newPartner = {
        Company: $('#addCompany').val(),
        Ranking: parseInt($('#addRanking').val()) || 9999,
        "Contact person": $('#addContact').val(),
        Position: $('#addPosition').val(),
        "Partnership Type": $('#addType').val(),
        Category: $('#addCategory').val(),
        Subcategory: $('#addSubcategory').val(),
        Region: $('#addRegion').val(),
        startDate: $('#addStartDate').val(),
        endDate: $('#addEndDate').val(),
        Email: $('#addEmail').val(),
        URL: $('#addURL').val(),
        notes: $('#addNotes').val(),
        status: "Not Started"
      };

      partnerData.push(newPartner);
      saveToLocalStorage();

      $('#partnersTable').DataTable().destroy(); // Refresh
      populateTable();

      $('#addPartnerModal').hide();
      $('#addPartnerModal input, #addPartnerModal select, #addPartnerModal textarea').val('');
    }

    function showAddPartnerModal() {
      document.getElementById("addPartnerModal").style.display = "flex";
    }

    function hideAddPartnerModal() {
      document.getElementById("addPartnerModal").style.display = "none";
    }


  </script>
</body>
</html>
