.navbar-scrolled .navbar-svg  { stroke:#000000 !important; }
.navbar-scrolled #navbar-logo { filter: invert(1) !important; }
.navbar-scrolled { background-color: rgba(255,255,255,0.95) !important; backdrop-filter: blur(12px) !important; }

/* Hide navbar when hero leaves (class name fixed) */
.navbar-hidden { transform: translateY(-100%) !important; }
</style>

<!-- ===== Scripts ===== -->
<script>
/* Rotating subheadline (accessible, reduced motion aware) */
(function(){
  const phrases = [
    'Neurological Data Analysis Across Diverse Modalities',
    'Multimodal AI-driven Drug Discovery Framework',
    'Spatial Genomics to Behaviour Assessment'
  ];
  const rotator = document.getElementById('rotator');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (rotator && !reduce) {
    let i = 0;
    setInterval(() => {
      i = (i + 1) % phrases.length;
      rotator.style.opacity = 0;
      setTimeout(() => {
        rotator.textContent = phrases[i];
        rotator.style.opacity = 1;
      }, 200);
    }, 2800);
  }
})();

/* Your original navbar logic (class names aligned) */
document.addEventListener('DOMContentLoaded', () => {
  const navbar = document.getElementById('navbar');
  const hero = document.getElementById('hero-section');

  if (!navbar || !hero) return;

  // Ensure a known starting state
  navbar.classList.remove('navbar-hidden');

  const closeMobileMenuIfOpen = () => {
    const toggle = document.getElementById('mobile-menu-toggle');
    if (toggle && toggle.checked) toggle.checked = false;
  };

  // Observe hero visibility
  const io = new IntersectionObserver(
    (entries) => {
      const entry = entries[0];
      if (entry.isIntersecting) {
        // Any part of hero on screen → show navbar
        navbar.classList.remove('navbar-hidden');
      } else {
        // Completely past hero → hide navbar and switch to scrolled style
        navbar.classList.add('navbar-hidden','navbar-scrolled');
        closeMobileMenuIfOpen();
      }
    },
    { root: null, threshold: 0, rootMargin: '0px' }
  );
  io.observe(hero);

  // Add scrolled style once user moves a bit
  window.addEventListener('scroll', () => {
    const top = window.scrollY || document.documentElement.scrollTop;
    if (top > 8) navbar.classList.add('navbar-scrolled');
    else navbar.classList.remove('navbar-scrolled');
  }, { passive: true });
});
</script>
